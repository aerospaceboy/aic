      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 10.0
      use_rotate_to_heading: false
      rotate_to_heading_angular_vel: 1.4
      rotate_to_heading_min_angle: 0.45
      max_angular_accel: 5.0
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.65
      max_robot_pose_search_dist: 10.0
      use_interpolation: true
    CornerFlowA:
      plugin: bot_navigation::AdaptiveDynamicController
      continuous_transit: false
      nominal_plugin: nav2_rotation_shim_controller::RotationShimController
      Nominal:
        transform_tolerance: 1.0
        plugin: nav2_rotation_shim_controller::RotationShimController
        primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
        angular_dist_threshold: 1.0
        angular_disengage_threshold: 0.2
        forward_sampling_distance: 0.5
        simulate_ahead_time: 1.0
        debug_trajectory_details: false
        desired_linear_vel: 0.75
        lookahead_dist: 0.45
        min_lookahead_dist: 0.35
        max_lookahead_dist: 0.9
        lookahead_time: 0.75
        use_velocity_scaled_lookahead_dist: true
        min_approach_linear_velocity: 0.1
        approach_velocity_scaling_dist: 0.35
        use_regulated_linear_velocity_scaling: true
        regulated_linear_scaling_min_radius: 1.2
        regulated_linear_scaling_min_speed: 0.25
        use_cost_regulated_linear_velocity_scaling: true
        cost_scaling_dist: 0.45
        cost_scaling_gain: 1.0
        inflation_cost_scaling_factor: 10.0
        use_rotate_to_heading: false
        rotate_to_heading_angular_vel: 1.4
        rotate_to_heading_min_angle: 0.45
        max_angular_accel: 5.0
        allow_reversing: false
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_carrot: 0.65
        max_robot_pose_search_dist: 10.0
        use_interpolation: true
      Dynamic:
        plugin: nav2_mppi_controller::MPPIController
        motion_model: DiffDrive
        time_steps: 36
        model_dt: 0.05
        batch_size: 1000
        iteration_count: 1
        vx_std: 0.35
        vy_std: 0.0
        wz_std: 0.8
        vx_max: 0.75
        vx_min: -0.1
        vy_max: 0.0
        wz_max: 2.4
        temperature: 0.2
        gamma: 0.015
        prune_distance: 3.5
        max_robot_pose_search_dist: 100.0
        transform_tolerance: 1.0
        visualize: false
        retry_attempt_limit: 1
        reset_period: 0.6
        critics:
        - ConstraintCritic
        - CostCritic
        - StaticClearanceCritic
        - SensorTimeCritic
        - GoalCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic
        - TwirlingCritic
        - GoalAngleCritic
        ConstraintCritic:
          enabled: true
          cost_weight: 4.0
          cost_power: 1
        CostCritic:
          enabled: true
          cost_weight: 8.0
          cost_power: 1
          critical_cost: 300.0
          collision_cost: 10000000.0
          consider_footprint: false
          near_goal_distance: 0.6
        StaticClearanceCritic:
          enabled: true
          clearance: 0.48
        SensorTimeCritic:
          enabled: true
          cost_weight: 12.0
          clearance: 0.1
          collision_cost: 200.0
        GoalCritic:
          enabled: true
          cost_weight: 8.0
          cost_power: 1
          threshold_to_consider: 1.8
        PathAlignCritic:
          enabled: true
          cost_weight: 8.0
          cost_power: 1
          max_path_occupancy_ratio: 0.05
          trajectory_point_step: 3
          threshold_to_consider: 0.5
          offset_from_furthest: 18
          use_path_orientations: false
        PathFollowCritic:
          enabled: true
          cost_weight: 8.0
          cost_power: 1
          offset_from_furthest: 8
          threshold_to_consider: 1.8
        PathAngleCritic:
          enabled: true
          cost_weight: 6.0
          cost_power: 1
          offset_from_furthest: 4
          threshold_to_consider: 0.5
          max_angle_to_furthest: 0.35
          forward_preference: true
        PreferForwardCritic:
          enabled: true
          cost_weight: 3.0
          cost_power: 1
          threshold_to_consider: 0.5
        TwirlingCritic:
          enabled: true
          cost_weight: 0.1
          cost_power: 1
        GoalAngleCritic:
          enabled: false
          cost_weight: 3.0
          cost_power: 1
          threshold_to_consider: 0.8
      require_nonholonomic: true
      dynamic_release_delay: 0.5
      dynamic_reentry_delay: 0.75
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      transform_tolerance: 1.0
      robot_radius: 0.28
      plugins:
      - obstacle_layer
      - static_layer
      - prediction_layer
      - inflation_layer
      prediction_layer:
        plugin: bot_navigation::PredictionLayer
        enabled: true
        timeout: 0.5
        robot_egress_radius: 0.33
        timed_future_cost: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 10.0
        inflation_radius: 0.45
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        track_unknown_space: true
        max_obstacle_height: 2.0
        observation_sources: scan placed_cubes
        scan:
          topic: /scan_payload_masked
          min_obstacle_height: 0.2
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
        placed_cubes:
          topic: /competition/placed_cubes
          data_type: PointCloud2
          min_obstacle_height: 0.0
          max_obstacle_height: 0.3
          obstacle_max_range: 30.0
          clearing: false
          marking: true
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        footprint_clearing_enabled: true
      always_send_full_costmap: false
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.38
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - dynamic_layer
      - prediction_layer
      - sweep_band_layer
      - inflation_layer
      prediction_layer:
        plugin: bot_navigation::PredictionLayer
        enabled: true
        timeout: 0.5
        robot_egress_radius: 0.33
        timed_future_cost: false
      dynamic_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan_clear dynamic_points
        scan_clear:
          topic: /scan_payload_masked
          data_type: LaserScan
          marking: false
          clearing: true
          inf_is_valid: true
          min_obstacle_height: 0.2
          max_obstacle_height: 2.0
          raytrace_max_range: 4.5
          raytrace_min_range: 0.0
        dynamic_points:
          topic: /competition/dynamic_obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.2
          max_obstacle_height: 2.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
      sweep_band_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: keepout_points
        keepout_points:
          topic: /competition/sweep_band_keepout
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 30.0
          obstacle_min_range: 0.0
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: placed_cubes
        placed_cubes:
          topic: /competition/placed_cubes
          data_type: PointCloud2
          min_obstacle_height: 0.0
          max_obstacle_height: 0.3
          obstacle_max_range: 30.0
          clearing: false
          marking: true
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        footprint_clearing_enabled: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 10.0
        inflation_radius: 0.65
      always_send_full_costmap: false
