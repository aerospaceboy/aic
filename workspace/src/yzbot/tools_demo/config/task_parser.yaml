competition_task_question:
  ros__parameters:
    random_seed: -1
    publish_delay_sec: 1.0
    period_sec: 0.0
    question_topic: /competition/task/question

competition_task_parser:
  ros__parameters:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen3.8-max
    api_key_env: DASHSCOPE_API_KEY
    llm_enable_thinking: false
    llm_max_tokens: 4096
    connect_timeout_sec: 4.0
    read_timeout_sec: 35.0
    solve_budget_sec: 40.0
    llm_max_retries: 1
    timeout_sec: 20.0
    question_topic: /competition/task/question
    plan_topic: /competition/task/plan
    counts_topic: /competition/task/counts
    order_topic: /competition/task/order
    llm_status_topic: /competition/task/llm_status
